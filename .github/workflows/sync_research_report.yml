name: Check Local Research Report Sync

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-local-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify private fetch and local review boundaries offline
        run: python -m unittest discover -s tests -p 'test_*research*.py'
